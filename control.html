<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">
    <title>Rigol DHO Web Control</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #pic {
            display: block;
            background: #000;
            cursor: default;
            touch-action: none;
        }

        #startup-hint {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            max-width: min(90vw, 44rem);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font: 600 14px/1.4 Arial, Helvetica, sans-serif;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 180ms ease;
        }

        #startup-hint.is-visible {
            opacity: 1;
        }
    </style>
    <script src="./res/config.js"></script>
    <script src="./res/http-live-player.js"></script>
</head>
<body>
    <canvas id="pic"></canvas>
    <div id="startup-hint" aria-live="polite"></div>

    <script>
        // Fixed logical resolution of the Rigol instrument display.
        const BASE_WIDTH = 1024;
        const BASE_HEIGHT = 600;

        // Persist only the last useful popup bounds from normal windowed mode.
        const WINDOW_STATE_STORAGE_KEY = "rigol-dho-control.window-state.v1";
        const FULLSCREEN_STATE_STORAGE_KEY = "rigol-dho-control.fullscreen-state.v1";

        const BOUNDS_POLL_INTERVAL_MS = 400;
        const PROGRAMMATIC_CHANGE_SUPPRESSION_MS = 1800;
        const RESTORE_RETRY_DELAYS_MS = [0, 80, 220, 600, 1200];
        const STARTUP_HINT_DURATION_MS = 5000;
        const FULLSCREEN_EXIT_PERSIST_DELAY_MS = 160;
        const FULLSCREEN_DBLCLICK_GUARD_MS = 700;
        const DOG_RESET_COUNT = 20;

        const state = {
            streamWidth: BASE_WIDTH,
            streamHeight: BASE_HEIGHT,
            inputScale: 1,
            inputOffsetX: 0,
            inputOffsetY: 0,
            suppressPersistenceUntil: 0,
            lastWindowStateSignature: "",
            placementRetryHandles: [],
            activePointerId: null,
            pointerIsDown: false,
            pointerDownTime: 0,
            lastPointerPoint: null,
            connectionAlertShown: false,
            startupHintTimer: null,
            fullscreenPreferred: false,
            pendingFullscreenRestore: false,
            fullscreenRequestInFlight: false,
            fullscreenDisabledForSession: false,
            lastFullscreenEntryAt: 0,
            isPageUnloading: false,
            dogCount: DOG_RESET_COUNT * 3,
            reconnecting: false
        };

        const displayCanvas = document.getElementById("pic");
        const startupHint = document.getElementById("startup-hint");
        const wsavc = new WSAvcPlayer(displayCanvas, "webgl", 1, 35);
        const controlEvent = newWebSocket(controlEventServerUrl);

        function clamp(value, minValue, maxValue) {
            return Math.max(minValue, Math.min(maxValue, value));
        }

        function getQueryParam(name) {
            try {
                return new URLSearchParams(window.location.search).get(name);
            } catch (error) {
                return null;
            }
        }

        function readJsonFromStorage(storage, key, fallbackValue) {
            try {
                const rawValue = storage.getItem(key);
                return rawValue ? JSON.parse(rawValue) : fallbackValue;
            } catch (error) {
                console.warn("Unable to read stored JSON value.", error);
                return fallbackValue;
            }
        }

        function writeJsonToStorage(storage, key, value) {
            try {
                storage.setItem(key, JSON.stringify(value));
            } catch (error) {
                console.warn("Unable to write stored JSON value.", error);
            }
        }

        function isReloadNavigation() {
            try {
                const entries = performance.getEntriesByType("navigation");
                if (entries && entries.length) {
                    return entries[0].type === "reload";
                }
            } catch (error) {
            }

            try {
                return performance.navigation && performance.navigation.type === 1;
            } catch (error) {
                return false;
            }
        }

        function isFullscreenActive() {
            return Boolean(document.fullscreenElement);
        }

        function canUseFullscreenMode() {
            return Boolean(
                !state.fullscreenDisabledForSession &&
                document.fullscreenEnabled &&
                document.documentElement &&
                typeof document.documentElement.requestFullscreen === "function"
            );
        }

        function readStoredFullscreenPreference() {
            const savedState = readJsonFromStorage(localStorage, FULLSCREEN_STATE_STORAGE_KEY, null);
            return Boolean(savedState && savedState.preferred);
        }

        function saveFullscreenPreference(isPreferred) {
            state.fullscreenPreferred = Boolean(isPreferred);
            writeJsonToStorage(localStorage, FULLSCREEN_STATE_STORAGE_KEY, {
                preferred: state.fullscreenPreferred,
                updatedAt: Date.now()
            });
        }

        function getWindowChromeDelta() {
            return {
                width: Math.max(0, (window.outerWidth || 0) - (window.innerWidth || 0)),
                height: Math.max(0, (window.outerHeight || 0) - (window.innerHeight || 0))
            };
        }

        function getViewportSize() {
            return {
                width: Math.max(1, Math.round(window.innerWidth || BASE_WIDTH)),
                height: Math.max(1, Math.round(window.innerHeight || BASE_HEIGHT))
            };
        }

        function getWindowPosition() {
            const x = Number.isFinite(window.screenX) ? window.screenX : (Number.isFinite(window.screenLeft) ? window.screenLeft : 0);
            const y = Number.isFinite(window.screenY) ? window.screenY : (Number.isFinite(window.screenTop) ? window.screenTop : 0);
            return {
                x: Math.round(x),
                y: Math.round(y)
            };
        }

        function getCurrentWindowState() {
            const viewport = getViewportSize();
            const position = getWindowPosition();
            return {
                viewportWidth: viewport.width,
                viewportHeight: viewport.height,
                x: position.x,
                y: position.y,
                updatedAt: Date.now()
            };
        }

        function makeWindowStateSignature(windowState) {
            return [windowState.viewportWidth, windowState.viewportHeight, windowState.x, windowState.y].join("|");
        }

        function readStoredWindowState() {
            const savedState = readJsonFromStorage(localStorage, WINDOW_STATE_STORAGE_KEY, null);
            if (!savedState) {
                return null;
            }

            const viewportWidth = Number.isFinite(savedState.viewportWidth) ? Math.max(200, Math.round(savedState.viewportWidth)) : null;
            const viewportHeight = Number.isFinite(savedState.viewportHeight) ? Math.max(100, Math.round(savedState.viewportHeight)) : null;
            const x = Number.isFinite(savedState.x) ? Math.round(savedState.x) : null;
            const y = Number.isFinite(savedState.y) ? Math.round(savedState.y) : null;

            if (!viewportWidth || !viewportHeight) {
                return null;
            }

            return {
                viewportWidth: viewportWidth,
                viewportHeight: viewportHeight,
                x: x,
                y: y,
                updatedAt: Number.isFinite(savedState.updatedAt) ? savedState.updatedAt : Date.now()
            };
        }

        function saveWindowState(windowState) {
            writeJsonToStorage(localStorage, WINDOW_STATE_STORAGE_KEY, windowState);
        }

        function suppressWindowStatePersistenceFor(durationMs) {
            state.suppressPersistenceUntil = Math.max(state.suppressPersistenceUntil, Date.now() + durationMs);
        }

        function isWindowStatePersistenceSuppressed() {
            return Date.now() < state.suppressPersistenceUntil;
        }

        // Persist window bounds only while not in fullscreen so the last normal popup
        // size and position survive fullscreen sessions.
        function persistCurrentWindowState(force) {
            if (isFullscreenActive()) {
                return;
            }

            if (!force && isWindowStatePersistenceSuppressed()) {
                return;
            }

            const windowState = getCurrentWindowState();
            const signature = makeWindowStateSignature(windowState);
            if (!force && signature === state.lastWindowStateSignature) {
                return;
            }

            state.lastWindowStateSignature = signature;
            saveWindowState(windowState);
        }

        function startWindowStatePolling() {
            window.setInterval(function () {
                persistCurrentWindowState(false);
            }, BOUNDS_POLL_INTERVAL_MS);

            function handlePageShutdown() {
                state.isPageUnloading = true;
                clearPlacementRetryHandles();
                persistCurrentWindowState(true);
                saveFullscreenPreference(state.fullscreenPreferred || isFullscreenActive());
            }

            window.addEventListener("pagehide", handlePageShutdown);
            window.addEventListener("beforeunload", handlePageShutdown);
        }

        // Map the decoded video frame to the logical 1024x600 control surface.
        function updateInputMapping(frameWidth, frameHeight) {
            state.streamWidth = frameWidth || BASE_WIDTH;
            state.streamHeight = frameHeight || BASE_HEIGHT;

            const scaleX = state.streamWidth / BASE_WIDTH;
            const scaleY = state.streamHeight / BASE_HEIGHT;
            state.inputScale = Math.min(scaleX, scaleY) || 1;
            state.inputOffsetX = (state.streamWidth - BASE_WIDTH * state.inputScale) / 2;
            state.inputOffsetY = (state.streamHeight - BASE_HEIGHT * state.inputScale) / 2;
        }

        // Scale the visible display into the available browser viewport while keeping
        // the instrument aspect ratio stable.
        function updateCanvasLayout() {
            const viewportWidth = Math.max(1, window.innerWidth || BASE_WIDTH);
            const viewportHeight = Math.max(1, window.innerHeight || BASE_HEIGHT);
            const fitScale = Math.min(viewportWidth / BASE_WIDTH, viewportHeight / BASE_HEIGHT);
            const cssWidth = Math.max(1, Math.round(BASE_WIDTH * fitScale));
            const cssHeight = Math.max(1, Math.round(BASE_HEIGHT * fitScale));

            displayCanvas.style.width = cssWidth + "px";
            displayCanvas.style.height = cssHeight + "px";
        }

        // Convert browser pointer coordinates back into logical Rigol coordinates.
        function mapPointerToLogicalDisplay(evt, clampToBounds) {
            const rect = displayCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) {
                return null;
            }

            const streamX = (evt.clientX - rect.left) * state.streamWidth / rect.width;
            const streamY = (evt.clientY - rect.top) * state.streamHeight / rect.height;
            let logicalX = (streamX - state.inputOffsetX) / state.inputScale;
            let logicalY = (streamY - state.inputOffsetY) / state.inputScale;

            if (clampToBounds) {
                logicalX = clamp(logicalX, 0, BASE_WIDTH);
                logicalY = clamp(logicalY, 0, BASE_HEIGHT);
            } else if (logicalX < 0 || logicalX > BASE_WIDTH || logicalY < 0 || logicalY > BASE_HEIGHT) {
                return null;
            }

            return {
                x: Math.round(logicalX),
                y: Math.round(logicalY)
            };
        }

        function sendTouchEvent(eventType, x, y) {
            if (!controlEvent || controlEvent.readyState !== WebSocket.OPEN) {
                return;
            }

            controlEvent.send(JSON.stringify({
                type: eventType,
                downDelta: Date.now() - state.pointerDownTime,
                clientX: x,
                clientY: y
            }));
        }

        function rememberPointerPoint(point) {
            if (point) {
                state.lastPointerPoint = point;
            }
        }

        function showStartupHint(message) {
            if (!message) {
                return;
            }

            if (state.startupHintTimer) {
                clearTimeout(state.startupHintTimer);
            }

            startupHint.textContent = message;
            startupHint.classList.add("is-visible");
            state.startupHintTimer = window.setTimeout(hideStartupHint, STARTUP_HINT_DURATION_MS);
        }

        function hideStartupHint() {
            if (state.startupHintTimer) {
                clearTimeout(state.startupHintTimer);
                state.startupHintTimer = null;
            }

            startupHint.classList.remove("is-visible");
            startupHint.textContent = "";
        }

        function updateStartupHint() {
            if (!canUseFullscreenMode()) {
                hideStartupHint();
                return;
            }

            if (state.pendingFullscreenRestore) {
                showStartupHint("Full screen was active last time. Tap or click once to restore it. Double-click toggles full screen.");
                return;
            }

            showStartupHint("Double-click toggles full screen.");
        }

        function requestFullscreenForDisplay() {
            if (!canUseFullscreenMode()) {
                return Promise.resolve(false);
            }

            try {
                return Promise.resolve(document.documentElement.requestFullscreen()).then(function () {
                    return true;
                }).catch(function (error) {
                    console.warn("Unable to enter fullscreen mode.", error);
                    return false;
                });
            } catch (error) {
                console.warn("Unable to enter fullscreen mode.", error);
                return Promise.resolve(false);
            }
        }

        function exitFullscreenForDisplay() {
            if (!isFullscreenActive()) {
                return Promise.resolve(true);
            }

            try {
                return Promise.resolve(document.exitFullscreen()).then(function () {
                    return true;
                }).catch(function (error) {
                    console.warn("Unable to exit fullscreen mode.", error);
                    return false;
                });
            } catch (error) {
                console.warn("Unable to exit fullscreen mode.", error);
                return Promise.resolve(false);
            }
        }

        // Restore fullscreen on the first valid user interaction only when the browser
        // exposes fullscreen support for this environment.
        function triggerPendingFullscreenRestore() {
            if (!state.pendingFullscreenRestore || isFullscreenActive() || state.fullscreenRequestInFlight || !canUseFullscreenMode()) {
                return;
            }

            state.fullscreenRequestInFlight = true;
            requestFullscreenForDisplay().then(function (enteredFullscreen) {
                state.fullscreenRequestInFlight = false;

                if (enteredFullscreen) {
                    state.pendingFullscreenRestore = false;
                    state.lastFullscreenEntryAt = Date.now();
                    saveFullscreenPreference(true);
                    hideStartupHint();
                    updateCanvasLayout();
                    return;
                }

                state.fullscreenDisabledForSession = true;
                hideStartupHint();
            });
        }

        function toggleFullscreenMode() {
            if (isFullscreenActive()) {
                exitFullscreenForDisplay();
                return;
            }

            requestFullscreenForDisplay().then(function (enteredFullscreen) {
                if (!enteredFullscreen) {
                    state.fullscreenDisabledForSession = true;
                    hideStartupHint();
                    return;
                }

                state.pendingFullscreenRestore = false;
                state.lastFullscreenEntryAt = Date.now();
                saveFullscreenPreference(true);
                hideStartupHint();
            });
        }

        function handleFullscreenChange() {
            updateCanvasLayout();

            if (isFullscreenActive()) {
                state.pendingFullscreenRestore = false;
                state.lastFullscreenEntryAt = Date.now();
                saveFullscreenPreference(true);
                hideStartupHint();
                return;
            }

            if (state.isPageUnloading) {
                return;
            }

            saveFullscreenPreference(false);
            window.setTimeout(function () {
                persistCurrentWindowState(true);
            }, FULLSCREEN_EXIT_PERSIST_DELAY_MS);
        }

        function maybeRestoreFullscreenOnPointerDown(evt) {
            if (evt.pointerType === "touch" || evt.pointerType === "pen") {
                return;
            }
            triggerPendingFullscreenRestore();
        }

        function maybeRestoreFullscreenOnPointerUp(evt) {
            if (evt.pointerType === "touch" || evt.pointerType === "pen") {
                triggerPendingFullscreenRestore();
            }
        }

        function handlePointerDown(evt) {
            if (!evt.isPrimary) {
                return;
            }

            maybeRestoreFullscreenOnPointerDown(evt);

            const point = mapPointerToLogicalDisplay(evt, false);
            if (!point) {
                return;
            }

            evt.preventDefault();
            state.activePointerId = evt.pointerId;
            state.pointerIsDown = true;
            state.pointerDownTime = Date.now();
            rememberPointerPoint(point);

            if (typeof displayCanvas.setPointerCapture === "function") {
                try {
                    displayCanvas.setPointerCapture(evt.pointerId);
                } catch (error) {
                }
            }

            sendTouchEvent("onmousedown", point.x, point.y);
        }

        function handlePointerMove(evt) {
            if (!state.pointerIsDown || evt.pointerId !== state.activePointerId) {
                return;
            }

            const point = mapPointerToLogicalDisplay(evt, true);
            if (!point) {
                return;
            }

            evt.preventDefault();
            rememberPointerPoint(point);
            sendTouchEvent("onmousemove", point.x, point.y);
        }

        function finishPointerInteraction(evt, eventType) {
            if (!state.pointerIsDown) {
                return;
            }

            if (evt && evt.pointerId !== state.activePointerId) {
                return;
            }

            let point = evt ? mapPointerToLogicalDisplay(evt, true) : null;
            if (!point) {
                point = state.lastPointerPoint;
            }

            if (evt) {
                evt.preventDefault();
            }

            if (point) {
                sendTouchEvent(eventType, point.x, point.y);
            }

            state.pointerIsDown = false;
            state.activePointerId = null;
        }

        function setupPointerHandlers() {
            displayCanvas.addEventListener("pointerdown", handlePointerDown);
            displayCanvas.addEventListener("pointermove", handlePointerMove);
            displayCanvas.addEventListener("pointerup", function (evt) {
                maybeRestoreFullscreenOnPointerUp(evt);
                finishPointerInteraction(evt, "onmouseup");
            });
            displayCanvas.addEventListener("pointercancel", function (evt) {
                finishPointerInteraction(evt, "onmouseup");
            });
            displayCanvas.addEventListener("pointerleave", function (evt) {
                finishPointerInteraction(evt, "onmouseup");
            });
            displayCanvas.addEventListener("dblclick", function (evt) {
                evt.preventDefault();
                if (Date.now() - state.lastFullscreenEntryAt < FULLSCREEN_DBLCLICK_GUARD_MS) {
                    return;
                }
                toggleFullscreenMode();
            });
        }

        function clearPlacementRetryHandles() {
            for (const handle of state.placementRetryHandles) {
                clearTimeout(handle);
            }
            state.placementRetryHandles = [];
        }

        function resizeWindowToViewport(viewportWidth, viewportHeight) {
            if (typeof window.resizeTo !== "function") {
                return;
            }

            const chrome = getWindowChromeDelta();
            const outerWidth = Math.max(200, Math.round(viewportWidth + chrome.width));
            const outerHeight = Math.max(100, Math.round(viewportHeight + chrome.height));

            try {
                window.resizeTo(outerWidth, outerHeight);
            } catch (error) {
                console.warn("Unable to resize popup window.", error);
            }
        }

        function moveWindowTo(targetX, targetY) {
            if (typeof window.moveTo !== "function") {
                return;
            }
            if (!Number.isFinite(targetX) || !Number.isFinite(targetY)) {
                return;
            }

            try {
                window.moveTo(Math.round(targetX), Math.round(targetY));
            } catch (error) {
                console.warn("Unable to move popup window.", error);
            }
        }

        function schedulePlacementRestore(viewportWidth, viewportHeight, targetX, targetY) {
            clearPlacementRetryHandles();
            suppressWindowStatePersistenceFor(
                PROGRAMMATIC_CHANGE_SUPPRESSION_MS + RESTORE_RETRY_DELAYS_MS[RESTORE_RETRY_DELAYS_MS.length - 1]
            );

            for (const delay of RESTORE_RETRY_DELAYS_MS) {
                const handle = window.setTimeout(function () {
                    resizeWindowToViewport(viewportWidth, viewportHeight);
                    moveWindowTo(targetX, targetY);
                }, delay);
                state.placementRetryHandles.push(handle);
            }

            const finalizeHandle = window.setTimeout(function () {
                updateCanvasLayout();
                persistCurrentWindowState(true);
                clearPlacementRetryHandles();
            }, RESTORE_RETRY_DELAYS_MS[RESTORE_RETRY_DELAYS_MS.length - 1] + 300);
            state.placementRetryHandles.push(finalizeHandle);
        }

        function restoreInitialWindowPlacement() {
            const savedState = readStoredWindowState();
            const viewportWidth = savedState ? savedState.viewportWidth : BASE_WIDTH;
            const viewportHeight = savedState ? savedState.viewportHeight : BASE_HEIGHT;
            const currentPosition = getWindowPosition();
            const targetX = savedState && Number.isFinite(savedState.x) ? savedState.x : currentPosition.x;
            const targetY = savedState && Number.isFinite(savedState.y) ? savedState.y : currentPosition.y;

            if (isReloadNavigation()) {
                state.lastWindowStateSignature = makeWindowStateSignature(getCurrentWindowState());
                updateCanvasLayout();
                return;
            }

            schedulePlacementRestore(viewportWidth, viewportHeight, targetX, targetY);
        }

        function feedDog() {
            state.dogCount = DOG_RESET_COUNT;
        }

        function showConnectionClosedAlertOnce() {
            if (state.connectionAlertShown) {
                return;
            }

            state.connectionAlertShown = true;
            alert("The connection was interrupted, or another client connected to the instrument. This session has been closed.\nTry refreshing the page to reconnect.");
        }

        function reconnectStream() {
            if (state.reconnecting) {
                return;
            }

            state.reconnecting = true;
            window.setTimeout(function () {
                try {
                    wsavc.connect(screenSharingServerUrl);
                } catch (error) {
                    console.warn("Unable to reconnect the video stream.", error);
                }
                feedDog();
            }, 25);
        }

        wsavc.setSocketMessageCallback(function () {
            state.reconnecting = false;
            state.connectionAlertShown = false;
            feedDog();
        });

        wsavc.setSizeChangedCallback(function (width, height) {
            try {
                displayCanvas.width = width;
                displayCanvas.height = height;
                updateInputMapping(width, height);
                updateCanvasLayout();
            } catch (error) {
                console.error(error);
            }
        });

        wsavc.setSocketConnectCallback(function () {
            const message = {
                type: "SET_ENCODER",
                size: getQueryParam("size"),
                rate: getQueryParam("rate")
            };
            this.ws.send(JSON.stringify(message));
        });

        wsavc.setSocketClosedCallback(function () {
            if (controlEvent.readyState === WebSocket.OPEN && !state.reconnecting) {
                reconnectStream();
            }
        });

        function onDog() {
            state.dogCount -= 1;
            if (state.dogCount > 0) {
                return;
            }

            if (!state.reconnecting) {
                try {
                    wsavc.disconnect();
                } catch (error) {
                }
                reconnectStream();
                return;
            }

            showConnectionClosedAlertOnce();
        }

        function initializeApplication() {
            state.fullscreenPreferred = readStoredFullscreenPreference();
            state.pendingFullscreenRestore = state.fullscreenPreferred && canUseFullscreenMode();

            updateInputMapping(BASE_WIDTH, BASE_HEIGHT);
            updateCanvasLayout();
            setupPointerHandlers();
            startWindowStatePolling();
            restoreInitialWindowPlacement();

            window.addEventListener("resize", updateCanvasLayout);
            document.addEventListener("fullscreenchange", handleFullscreenChange);

            updateStartupHint();

            wsavc.connect(screenSharingServerUrl);
            window.wsavc = wsavc;
            window.controlEvent = controlEvent;
            window.setInterval(onDog, 100);
        }

        window.addEventListener("load", initializeApplication, { once: true });
    </script>
</body>
</html>
